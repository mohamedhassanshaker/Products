# Serves the widget-embed build's two independent static outputs:
#   /loader/nextbot.js   -> the vanilla-JS host-page <script> loader
#   /widget/index.html   -> the iframe-hosted React/Chakra widget SPA
# Both are read-only static assets; no server-side logic lives in this container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Access-Control-Allow-Origin *;

    location /loader/ {
        add_header Cache-Control "no-cache";
    }

    location /widget/ {
        try_files $uri $uri/ /widget/index.html;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
