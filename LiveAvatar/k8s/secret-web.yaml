# PLACEHOLDER. Do not apply as-is in production — replace every
# REPLACE_ME_* value via your cluster's real secret-management tool
# (Vault/External Secrets Operator, sealed-secrets, cloud KMS-backed CSI
# driver, or at minimum `kubectl create secret generic --from-literal` from
# a value never committed to git). No tool is named here because neither the
# HLD nor ADR-001 picks one — flagged as an open question in
# docs/deployment/DEPLOYMENT.md.
apiVersion: v1
kind: Secret
metadata:
  name: liveavatar-web-secrets
  namespace: liveavatar
type: Opaque
stringData:
  DATABASE_URL: 'REPLACE_ME_postgresql://user:password@managed-postgres-host:5432/liveavatar'
  JWT_ACCESS_SECRET: 'REPLACE_ME_min_32_chars'
  JWT_REFRESH_SECRET: 'REPLACE_ME_min_32_chars'
  BOOTSTRAP_SECRET: 'REPLACE_ME_bootstrap_secret'
  LIVEKIT_API_KEY: 'REPLACE_ME_livekit_api_key'
  LIVEKIT_API_SECRET: 'REPLACE_ME_livekit_api_secret_min_32_chars'
  INTERNAL_TOKEN: 'REPLACE_ME_internal_token_min_16_chars' # must equal liveavatar-agent-secrets' INTERNAL_TOKEN
  # Same key/secret pair as the two entries above, in the `<key>: <secret>`
  # form LiveKit server's own LIVEKIT_KEYS env var expects (k8s/livekit.yaml).
  # Keep both representations in sync — duplicated here only because
  # LiveKit's config format differs from this app's two discrete env vars.
  LIVEKIT_API_KEY_PAIR: 'REPLACE_ME_livekit_api_key: REPLACE_ME_livekit_api_secret_min_32_chars'
