apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shj3.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-web") | nindent 4 }}
  annotations:
    shj3.ae/purpose: "web/BFF; no Kubernetes API access required"
# §7.8, verbatim: neither runtime talks to the Kubernetes API, so the token is pure attack surface.
automountServiceAccountToken: false
