name: nextbot

# Full local application stack (Deployment phase). Distinct from `compose.yaml`
# (infra-only: Postgres + Redis, used by `pnpm dev` against locally-run Next dev
# servers) and `compose.test.yml` (ephemeral CI/integration-test infra) — this file
# brings up Postgres + Redis + ClickHouse + Neo4j (ADR-0018 — see the `neo4j`
# service's own comment below for the Enterprise-license disclosure this is NOT a
# substitute for) *and* all four containerized deployables (ADR-0002 §3/§6, HLD
# §7.1), plus one-shot migration/seed init jobs, so `docker compose up` alone gives
# a working, production-shaped local environment.
#
# **2026-09-01 gap fix**: the `neo4j` service, its six `GRAPH_STORE_*` env vars, and
# the `nextbot-knowledge-uploads-data` shared volume were all missing from this file
# from Target Architecture Blueprint Phase 7a onward — every dev/QA dispatch since
# then tested against `compose.test.yml`'s ephemeral `neo4j-test` stack, never this
# production-shaped file. See docs/deployment/DEPLOYMENT.md's "Neo4j / graph store"
# section for the full audit and what else was checked (migration coverage,
# ClickHouse schema provisioning, the `apps/ingest` vs. `apps/worker` doc gap).
#
# Quick start:
#   cp .env.docker.example .env.docker   # then edit secrets if you want non-default values
#   docker compose up --build
# See docs/deployment/DEPLOYMENT.md for the full walkthrough.

x-db-env: &db-env
  NEXTBOT_DB_ENV: "production"
  NEXTBOT_DB_OWNER_URL: postgres://${POSTGRES_OWNER_USER:-nextbot}:${POSTGRES_OWNER_PASSWORD:-nextbot_dev_password}@postgres:5432/${POSTGRES_DB:-nextbot}
  NEXTBOT_DB_APP_URL: postgres://${DB_APP_USER:-nextbot_app}:${DB_APP_PASSWORD:-app_dev_pw_change_me}@postgres:5432/${POSTGRES_DB:-nextbot}
  NEXTBOT_DB_PLATFORM_URL: postgres://${DB_PLATFORM_USER:-nextbot_platform}:${DB_PLATFORM_PASSWORD:-platform_dev_pw_change_me}@postgres:5432/${POSTGRES_DB:-nextbot}
  NEXTBOT_DB_GATEWAY_URL: postgres://${DB_GATEWAY_USER:-nextbot_gateway}:${DB_GATEWAY_PASSWORD:-gateway_dev_pw_change_me}@postgres:5432/${POSTGRES_DB:-nextbot}
  CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-nextbot}:${CLICKHOUSE_PASSWORD:-nextbot_dev_password}@clickhouse:8123/${CLICKHOUSE_DB:-nextbot}
  NEXTBOT_REDIS_URL: redis://redis:6379
  # Target Architecture Blueprint Phase 7a (ADR-0018) — `@nextbot/graph-store`'s
  # connection config (LLD §14.4.6). Gap fix, 2026-09-01: this whole `neo4j` service
  # and these six vars were missing from this file from Phase 7a onward — every
  # dev/QA dispatch since then only ever tested against `compose.test.yml`'s
  # ephemeral `neo4j-test` service, never this one. See docs/deployment/DEPLOYMENT.md
  # "Neo4j / graph store" section for the full write-up, including the Enterprise
  # license disclosure this is NOT a substitute for.
  #
  # `GRAPH_STORE_ADMIN_*` — the Neo4j default superuser (`neo4j`, whatever
  # `NEO4J_AUTH` below sets its password to). Used only by
  # `tenant-database-provisioner.ts` (DBMS-admin operations: CREATE DATABASE/ROLE/
  # USER/GRANT), never for tenant data reads/writes.
  # `GRAPH_STORE_SERVICE_*` — a distinct, lower-privilege user `withTenantGraph()`
  # connects as (holds no data privileges of its own, only IMPERSONATE on each
  # tenant's own restricted user, ADR-0018 §2.2). It does not need to already exist
  # in the `neo4j` image — `tenant-database-provisioner.ts`'s
  # `ensureServiceRoleAndUser()` creates it idempotently, with this password, the
  # first time any tenant is provisioned (via the `worker` service's
  # `tenancy.graph-provisioning-reconcile` job or the tenancy module's own
  # onboarding call) — there is no separate bootstrap step to run here.
  GRAPH_STORE_PROVIDER: "neo4j"
  GRAPH_STORE_URL: bolt://neo4j:7687
  GRAPH_STORE_ADMIN_USER: neo4j
  GRAPH_STORE_ADMIN_CREDENTIAL_REF: ${NEO4J_PASSWORD:-nextbot_neo4j_dev_password}
  GRAPH_STORE_SERVICE_USER: ${GRAPH_STORE_SERVICE_USER:-svc_graph}
  GRAPH_STORE_CREDENTIAL_REF: ${GRAPH_STORE_CREDENTIAL_REF:-svc_graph_dev_password_change_me}
  GRAPH_STORE_DATABASE_PREFIX: ${GRAPH_STORE_DATABASE_PREFIX:-t}

x-shared-env: &shared-env
  NEXTBOT_SESSION_SECRET: ${NEXTBOT_SESSION_SECRET:-dev-session-secret-please-change-me-32chars-min}
  NEXTBOT_WIDGET_SESSION_SECRET: ${NEXTBOT_WIDGET_SESSION_SECRET:-dev-widget-session-secret-please-change-32ch}
  NEXTBOT_KMS_MASTER_KEY: ${NEXTBOT_KMS_MASTER_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
  # Where this deployment's widget-embed static assets (the `nextbot.js` loader +
  # widget SPA, see `apps/widget-embed/nginx.conf`) are reachable from a customer's
  # *browser* — used only to render a working "Get embed snippet" in the Admin
  # Console (QA Final Review B3). Defaults to the `widget-embed` service's published
  # host port for a single-host `docker compose up` deployment; override with a real
  # CDN/reverse-proxy origin for a multi-host deployment.
  NEXTBOT_WIDGET_BASE_URL: ${NEXTBOT_WIDGET_BASE_URL:-http://localhost:8080}
  # Where `apps/web` reaches `apps/gateway` server-side (container-to-container, never
  # the browser) — used by the WhatsApp channel config screen's Webhook tab to derive
  # the real webhook URL and perform the "Re-verify Challenge" round trip (QA retry 1,
  # BL-15 dispatch #8 D1 fix). Defaults to the internal Docker network service name.
  NEXTBOT_GATEWAY_BASE_URL: ${NEXTBOT_GATEWAY_BASE_URL:-http://gateway:4001}
  # AI subsystem — see docs/deployment/DEPLOYMENT.md "AI provider configuration".
  # Placeholder defaults let the stack boot and every non-AI portal/flow work fully;
  # only an actual conversation/agent-run needs a real AI_BASE_URL/AI_API_KEY.
  AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
  AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL_CHAT_PRIMARY: ${AI_MODEL_CHAT_PRIMARY:-local-placeholder-model}
  AI_MODEL_CHAT_FAST: ${AI_MODEL_CHAT_FAST:-}
  AI_MODEL_REASONING_PLANNER: ${AI_MODEL_REASONING_PLANNER:-}
  AI_MODEL_CLASSIFY_GUARDRAIL: ${AI_MODEL_CLASSIFY_GUARDRAIL:-}
  AI_MODEL_SUMMARIZE: ${AI_MODEL_SUMMARIZE:-}
  AI_MODEL_EMBED: ${AI_MODEL_EMBED:-}
  # Target Architecture Blueprint Phase 7b (`packages/modules/knowledge/src/
  # infrastructure/upload-store.ts`) — the knowledge ingestion pipeline's minimal
  # local-disk upload store. Gap fix, 2026-09-01: this var was previously unset, so
  # each service fell back to its own container-local `.data/knowledge-uploads`
  # under its own process cwd — harmless for `web` alone, but fatal for the
  # pipeline, since `web`'s admin upload route (`putUpload`) and `worker`'s
  # ingestion-pump pipeline (`getUpload`, in `stage-ingest-parse-chunk.ts`) are
  # TWO SEPARATE CONTAINERS: without a shared path, `worker` could never find a
  # file `web` had just written, and every `Upload`-kind knowledge source would
  # fail ingestion with a spurious "file not found". Pointed at the new
  # `nextbot-knowledge-uploads-data` named volume, mounted at this same path in
  # both `web` and `worker` below, so it survives restarts and is visible to both.
  KNOWLEDGE_UPLOAD_STORE_ROOT: /data/knowledge-uploads
  # Platform Manager console (NFR-11, `/internal/ops/**`) — see
  # docs/deployment/DEPLOYMENT.md "Testing the Platform Manager console
  # locally" for the full explanation of these three defaults and why they are
  # safe *only* in this local-testing topology, never production.
  #
  # Unlike every other var in this anchor, these three are UNSET by
  # upstream default in `.env.docker.example` on purpose (the console
  # fail-closed 404s until deliberately turned on) — but a *local* stack with
  # nobody configuring anything should still be able to reach and log into the
  # console the same way it can already reach the regular Admin Console, so
  # this anchor supplies working local defaults directly (overridable via
  # `.env.docker`/`.env`, same as every other var here).
  #
  # NEXTBOT_OPS_OPERATOR_TOKEN: a real, non-empty generated token (not a
  # placeholder instruction to fill in) — see SEED_CREDENTIALS.md, which
  # documents it the same way it documents every other seeded credential.
  NEXTBOT_OPS_OPERATOR_TOKEN: ${NEXTBOT_OPS_OPERATOR_TOKEN:-632438c7ae617a5c6a22eaad8dfaf7452847c7c1798b724297bf2f9d32471d8c}
  # NEXTBOT_OPS_IP_ALLOWLIST: the caller IP the `web-proxy` service (below)
  # resolves a host-machine browser request to, on this compose stack's pinned
  # `172.30.238.0/24` network (its gateway address — see the `networks:`
  # section at the bottom of this file and `web-proxy`'s own comment).
  NEXTBOT_OPS_IP_ALLOWLIST: ${NEXTBOT_OPS_IP_ALLOWLIST:-172.30.238.1/32}
  # NEXTBOT_OPS_TRUSTED_PROXY_CIDRS: the `web-proxy` service's own pinned
  # address — the one hop this local topology actually guarantees sits in
  # front of `web` and overwrites (never appends to)
  # X-Forwarded-For/X-Real-IP from its own observed connection (see
  # docker/web-proxy/nginx.conf). Trusting exactly this one address, rather
  # than the whole compose subnet, keeps the trust grant as narrow as this
  # topology allows.
  NEXTBOT_OPS_TRUSTED_PROXY_CIDRS: ${NEXTBOT_OPS_TRUSTED_PROXY_CIDRS:-172.30.238.250/32}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-nextbot}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-nextbot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nextbot}
    ports:
      - "5432:5432"
    volumes:
      - nextbot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-nextbot} -d ${POSTGRES_DB:-nextbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nextbot-redis-data:/data
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ADR-0008 analytics/span store. Single node, HTTP interface (the
  # `@clickhouse/client` package used by packages/db speaks HTTP only).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-nextbot}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nextbot_dev_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-nextbot}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - nextbot-clickhouse-data:/var/lib/clickhouse
      # Forces IPv4-only listen (see file for why) — without this, on Docker
      # networks where IPv6 is disabled/unsupported, the server fails to bind
      # any port at all and the container never becomes healthy.
      - ./docker/clickhouse/listen-ipv4.xml:/etc/clickhouse-server/config.d/listen-ipv4.xml:ro
    healthcheck:
      # `127.0.0.1` explicitly, not `localhost` — this container's /etc/hosts
      # resolves `localhost` to `::1` first, and ClickHouse (see
      # docker/clickhouse/listen-ipv4.xml) only binds IPv4 on this stack, so
      # `wget http://localhost:...` fails even when the server is healthy.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Target Architecture Blueprint Phase 7a (ADR-0018) — the graph store's
  # tenant-isolation primitive. Gap fix, 2026-09-01: this service did not exist
  # anywhere in this file (see the `x-db-env` anchor's comment above for the full
  # story). Mirrors `compose.yaml`'s (local-dev) and `compose.test.yml`'s
  # (ephemeral CI) own `neo4j`/`neo4j-test` services exactly on image/auth/health
  # shape, but production-appropriate on persistence: a real named volume (not
  # `tmpfs`/ephemeral), so a tenant's graph survives a restart the same way
  # `nextbot-postgres-data`/`nextbot-clickhouse-data` already do.
  #
  # **Neo4j 5 ENTERPRISE Edition, not Community — and this is a real, disclosed
  # production cost, not a default to look past.** ADR-0018 §2.1 records why:
  # Community supports exactly one database and no RBAC/impersonation, which are
  # the two capabilities this platform's per-tenant graph-database isolation model
  # (ADR-0018 §2.2) is built on — without them, the only fallback is the
  # application-level `WHERE tenantId = ...` predicate ADR-0001 §3 already
  # rejected for Postgres, wearing a different query language. `neo4j-test`/
  # `neo4j` (compose.test.yml/compose.yaml) run this same Enterprise image under
  # its evaluation/development licence terms (`NEO4J_ACCEPT_LICENSE_AGREEMENT=yes`
  # is Neo4j's own documented mechanism for that) — that is legitimate for
  # dev/CI, but **it is NOT a production license**. A real production deployment
  # of this compose file MUST be run against a genuinely purchased Neo4j
  # Enterprise commercial license (ADR-0018 §4's disclosed budgeted cost) —
  # see docs/deployment/DEPLOYMENT.md's "Neo4j Enterprise licensing" section,
  # which this comment intentionally duplicates the headline of, so it cannot be
  # missed by only reading one of the two places.
  neo4j:
    image: neo4j:5-enterprise
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nextbot_neo4j_dev_password}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7687:7687" # Bolt — what `@nextbot/graph-store`'s driver actually connects to.
      - "7474:7474" # Neo4j Browser — operational convenience only, not used by the app.
    volumes:
      - nextbot-neo4j-data:/data
      - nextbot-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-nextbot_neo4j_dev_password} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  # One-shot init job: applies every packages/db/migrations/*.sql file (schema-owner
  # role) and idempotently ensures the app/platform/gateway roles (ensure-roles.ts).
  # Every app service depends on this completing successfully first.
  migrate:
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    env_file:
      - path: .env.docker
        required: false
    environment:
      <<: *db-env
    command: ["pnpm", "--filter", "@nextbot/db", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot init job: seeds the default demo tenant + one login per system role
  # (scripts/seed.ts). Idempotent — safe to re-run on every `docker compose up`.
  # Writes SEED_CREDENTIALS.md into the shared `nextbot-seed-output` volume so it's
  # easy to find from the host (see docs/deployment/DEPLOYMENT.md).
  seed:
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    env_file:
      - path: .env.docker
        required: false
    environment:
      <<: *db-env
    command: >
      sh -c "pnpm run db:seed && cp SEED_CREDENTIALS.md /seed-output/SEED_CREDENTIALS.md"
    volumes:
      - nextbot-seed-output:/seed-output
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      <<: [*db-env, *shared-env]
      PORT: "3000"
    # No `ports:` here (deliberately, since the `web-proxy` fix below): every
    # host-machine request — Admin Console and Platform Manager console alike —
    # now reaches `web` through `web-proxy`, which publishes the host port
    # instead. `web` is still reachable at `http://web:3000` from every other
    # container on this compose network (`web-proxy` included). See
    # `web-proxy`'s comment for why this hop exists.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - nextbot-knowledge-uploads-data:/data/knowledge-uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Local-testing-only reverse proxy in front of `web` (docker/web-proxy/nginx.conf).
  # Publishes the host port `web` used to publish directly, and exists for exactly
  # one reason: the Platform Manager console's IP-allowlist check
  # (apps/web/src/lib/platform-ops-network.ts) never trusts a client-suppliable
  # X-Forwarded-For/X-Real-IP header unless a real proxy sitting in front of `web`
  # is guaranteed to have set it from its own observed connection — Next.js's App
  # Router has no other way to learn a caller's real address. Before this fix,
  # `web` published its port directly with no such proxy, meaning the console's
  # IP check could never pass in this compose stack at all (see
  # docs/deployment/DEPLOYMENT.md's former "Known gaps" entry, now resolved for
  # local testing specifically — a *production* deployment's reverse-proxy/network-
  # isolation decision is still open, see "Open decisions").
  #
  # Pinned to a static IP (172.30.238.250 — deliberately near the TOP of the
  # `/24` range, not the bottom; see 2026-09-01 fix note below) on this compose
  # project's pinned `172.30.238.0/24` network (see `networks:` below) so
  # `NEXTBOT_OPS_TRUSTED_PROXY_CIDRS` above can name this exact address rather
  # than a whole subnet.
  #
  # **2026-09-01 fix**: this was `172.30.238.10` until adding the `neo4j` service
  # above (an 8th service needing a Compose-assigned dynamic address, up from 7)
  # caused Compose's sequential low-to-high IPAM allocation to hand `web` itself
  # the address `172.30.238.10` — an exact collision with this pin, which then
  # made `docker compose up` fail outright ("Address already in use") when
  # `web-proxy` tried to start. Confirmed against a real, fresh `docker compose
  # up` in this environment, not assumed. Re-pinning here to `.250` (far above
  # where sequential dynamic allocation starts, `.2`) fixes the collision and
  # is deliberately robust against a future service being added the same way
  # this one was — a low pinned address is fragile to exactly this class of
  # change and should not be reintroduced.
  web-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.238.250
    volumes:
      - ./docker/web-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/login"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      <<: [*db-env, *shared-env]
      PORT: "4001"
    ports:
      - "4001:4001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      <<: [*db-env, *shared-env]
    volumes:
      - nextbot-knowledge-uploads-data:/data/knowledge-uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  widget-embed:
    build:
      context: .
      dockerfile: apps/widget-embed/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  nextbot-postgres-data:
  nextbot-redis-data:
  nextbot-clickhouse-data:
  nextbot-seed-output:
  # Neo4j persistent state (ADR-0018) — a real named volume, unlike
  # `compose.test.yml`'s ephemeral `tmpfs`-backed `neo4j-test`, so a tenant's graph
  # survives a restart the same way the three volumes above already do for their
  # own datastores.
  nextbot-neo4j-data:
  nextbot-neo4j-logs:
  # Shared between `web` (writes, via the admin upload route) and `worker` (reads,
  # via the knowledge ingestion pipeline) — see `KNOWLEDGE_UPLOAD_STORE_ROOT`'s
  # comment above in the `x-shared-env` anchor for why this must be shared rather
  # than each container's own local disk.
  nextbot-knowledge-uploads-data:

# Pinned subnet (rather than letting Compose pick whatever bridge subnet is next
# free) purely so the Platform Manager console's local-testing defaults above
# (`NEXTBOT_OPS_IP_ALLOWLIST`/`NEXTBOT_OPS_TRUSTED_PROXY_CIDRS`) are deterministic
# across machines: `172.30.238.1` is this network's gateway address — the address
# every service on it (including `web-proxy`) observes as the source of a
# connection arriving from the host machine via a published port (confirmed
# empirically against this exact Docker Desktop networking model, not assumed) —
# and `172.30.238.250` is `web-proxy`'s own pinned address (see its own comment
# above for why this moved from `.10` to `.250` on 2026-09-01). If
# `172.30.238.0/24` collides with a network already in use on your machine, override both this
# subnet and the two `NEXTBOT_OPS_*` defaults above via `.env.docker`.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.238.0/24
