[project]
name = "avatar-agent"
version = "0.1.0"
description = "LiveAvatar conversation runtime — LiveKit Agents worker (STT -> LLM -> TTS -> avatar), Phase 4 (BL-013..BL-017)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "structlog>=24.1",
  "livekit-agents>=1.0",
  "livekit>=1.0",
  "openai>=1.40",
  "anthropic>=0.34",
  "google-genai>=0.1",
  "deepgram-sdk>=3.0",
  "faster-whisper>=1.0",
  "elevenlabs>=1.0",
  "langgraph>=0.2",
  "pydantic-ai>=0.0.1",
  "bithuman>=1.10",
  "websockets>=13,<16",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/avatar_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false

# Final Review D-2: `mypy src` was never run as a CI gate before this pass
# (only `ruff check`), so these were latent, not introduced here. Every
# remaining error after this pass's real fixes (pipeline.py's `object`-typed
# orchestrator/stream params -> proper `IOrchestrator`/`ILLMProvider`/
# `AsyncIterable[LlmChunk]` types; telemetry/logging.py's `Processor`
# signature) is a genuine vendor-SDK/type-stub mismatch, not a runtime
# defect — narrowly scoped and documented here rather than silently dropping
# the `mypy` gate or blanket-ignoring whole modules.
[[tool.mypy.overrides]]
# openai/anthropic/google-genai's stubs type `model` as a closed `Literal[...]`
# of their own known model ids. This project's registry resolves the model id
# from tenant-configured, env-driven settings (`AI_MODEL_CONVERSATION`, etc.)
# by design (ADR-001 §3: never a hardcoded vendor literal) — a `str` can
# never satisfy a vendor SDK's `Literal[...]`, and narrowing our own type to
# match would mean hardcoding one of their literal model ids back into the
# adapter, which is exactly the coupling the registry pattern exists to
# avoid. The other errors in the same three files are pre-existing streaming
# response-shape/overload mismatches between this project's adapter code and
# the installed SDK versions' stubs (tracked, not silently worked around).
module = ["avatar_agent.adapters.llm.openai", "avatar_agent.adapters.llm.anthropic", "avatar_agent.adapters.llm.google"]
disable_error_code = ["arg-type", "union-attr", "call-overload"]

[[tool.mypy.overrides]]
# `pydantic_graph.GraphBuilder`/`step` genuinely is `Generic[StateT, DepsT,
# GraphInputT, GraphOutputT]` at runtime (confirmed via direct introspection
# of the installed package) but the type checker resolves a differently
# shaped overload set for `.step` and reports the class as non-generic — a
# stub/runtime mismatch in the installed `pydantic-graph` version, not a
# defect in this file's usage of it.
module = "avatar_agent.orchestration.graph_pydantic_ai"
disable_error_code = ["type-arg", "call-overload"]
