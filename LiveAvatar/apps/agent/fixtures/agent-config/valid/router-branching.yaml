version: 1
deployment:
  tenant_id: "55555555-5555-5555-5555-555555555555"
  name: "Router Branching"
transport:
  provider: livekit
  room_namespace: router-branching
stt:
  provider: deepgram
  language: en-US
reasoning:
  entry_node_id: router-1
  background_entry_node_ids: [crm-log]
  turn_budget_ms: 2500
  graph:
    - id: router-1
      type: router
      name: Intent router
      lane: foreground
      on_error: { action: degrade }
      on_deadline: { action: degrade }
      branches:
        - condition: 'intent == "refund"'
          next_node_id: lookup-order
        - condition: 'intent in ["complaint", "escalation"]'
          next_node_id: end-1
      default_next_node_id: llm-1
    - id: lookup-order
      type: tool
      name: Lookup order
      lane: foreground
      on_error: { action: goto, target_node_id: llm-1 }
      on_deadline: { action: degrade }
      api_ref: order-lookup
      argument_mapping:
        order_id: "$utterance"
      timeout_ms: 5000
      next_node_id: speak-1
    - id: llm-1
      type: llm
      name: Compose answer
      lane: foreground
      on_error: { action: degrade }
      on_deadline: { action: degrade }
      provider: openai
      model: gpt-4o-mini
      retry:
        max_attempts: 2
        backoff_ms: [200, 400]
      next_node_id: speak-1
    - id: speak-1
      type: speak
      name: Speak answer
      lane: foreground
      on_error: { action: end_turn }
      on_deadline: { action: end_turn }
      mode: llm_output
      interruptible: true
      next_node_id: end-1
    - id: end-1
      type: end
      name: End turn
      lane: foreground
      on_error: { action: end_turn }
      on_deadline: { action: end_turn }
    - id: crm-log
      type: tool
      name: Log to CRM
      lane: background
      on_error: { action: end_turn }
      on_deadline: { action: end_turn }
      api_ref: crm-log-interaction
      argument_mapping: {}
      next_node_id: null
tts:
  provider: fish-speech
  voice_id: v1
avatar:
  provider: bithuman
  avatar_id: a1
agent:
  runtime: langgraph
  system_prompt: "hi"
  tools: []
  memory:
    enabled: true
    window_turns: 16
knowledge:
  pipeline:
    rewrite:
      enabled: true
      context_turns: 3
      budget_ms: 150
    hybrid_search:
      vector_weight: 0.6
      keyword_weight: 0.4
      candidates: 20
      budget_ms: 100
    metadata_filter:
      enabled: false
      budget_ms: 20
    rerank:
      enabled: false
    threshold:
      min_score: 0.5
      budget_ms: 10
    inject:
      token_cap: 1200
      citation_format: numbered
      budget_ms: 30
skills: []
privacy:
  send_to_remote_llm: prompt_text_only
  retain_transcripts_days: 90
  recordings_enabled: false
alerts:
  degraded_mode_message: "hold on"
