# Local-testing-only reverse proxy in front of `web` (docker-compose.yml's
# `web-proxy` service). Exists for exactly one reason: the Platform Manager
# console's IP-allowlist (NFR-11, `apps/web/src/lib/platform-ops-network.ts`)
# never trusts a client-suppliable `X-Forwarded-For`/`X-Real-IP` header unless
# `NEXTBOT_OPS_TRUSTED_PROXY_CIDRS` names a real proxy sitting in front of `web`
# that overwrites (never appends to) those headers from its own observed TCP
# connection — Next.js's App Router has no other way to learn a caller's real
# address (no raw socket access; see that module's doc comment). Without some
# proxy in this position, the console is unreachable in *any* deployment of
# this compose file, by design (fail closed).
#
# This is deliberately the simplest proxy that satisfies that requirement, not
# a production-shaped one: single hop, always overwrites (never appends), no
# TLS, no other proxying features. See docs/deployment/DEPLOYMENT.md "Testing
# the Platform Manager console locally" and its "Known gaps" section for what a
# real (non-local) deployment needs instead.

server {
  listen 80;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;

    # $http_host (not $host) so it carries the port the browser actually
    # connected to (localhost:3055, if WEB_HOST_PORT is overridden from its
    # 3000 default, etc.) — Next.js Server Actions reject a request whose
    # forwarded Host doesn't match its Origin header exactly, port included.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # Deliberately $remote_addr, not $proxy_add_x_forwarded_for — this proxy is
    # the only hop between the host machine and `web` in this compose stack, so
    # it must *overwrite* any inbound X-Forwarded-For/X-Real-IP with its own
    # observed connection, never append to (and thereby forward) a
    # caller-supplied value. Appending here would hand any caller the same
    # header-spoofing bypass QA's retry 1 pass already fixed once.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # WebSocket/streaming upgrade support (harmless no-op for plain HTTP
    # requests, needed if any current/future route uses it).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
