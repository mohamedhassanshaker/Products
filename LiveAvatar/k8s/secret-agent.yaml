# PLACEHOLDER — see k8s/secret-web.yaml's header note; same rules apply.
apiVersion: v1
kind: Secret
metadata:
  name: liveavatar-agent-secrets
  namespace: liveavatar
type: Opaque
stringData:
  INTERNAL_TOKEN: 'REPLACE_ME_internal_token_min_16_chars' # must equal liveavatar-web-secrets' INTERNAL_TOKEN
  LIVEKIT_API_KEY: 'REPLACE_ME_livekit_api_key'
  LIVEKIT_API_SECRET: 'REPLACE_ME_livekit_api_secret_min_32_chars'
  AI_API_KEY: 'REPLACE_ME_ai_provider_api_key'
---
# Vendor credentials (ProviderCredential.credential_ref) are files, not env
# vars — projected as one key per credential_ref into SECRETS_DIR on both
# `web` and `agent` (LLD §5.3's DirectorySecretStore contract). Add one
# stringData key per credential_ref actually referenced by a tenant's
# published Agent Builder config.
apiVersion: v1
kind: Secret
metadata:
  name: liveavatar-provider-credentials
  namespace: liveavatar
type: Opaque
stringData:
  deepgram: 'REPLACE_ME_deepgram_key'
  elevenlabs: 'REPLACE_ME_elevenlabs_key'
  alibaba-liveavatar: 'REPLACE_ME_alibaba_liveavatar_bearer_token'
