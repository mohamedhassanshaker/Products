# deployment.md §7.2 (excerpt reproduced verbatim, field-for-field) + §3.1's
# environment matrix.

global:
  env: production
  residency: uae-sharjah-dc
  imageRegistry: registry.shj.ae/shj3

web:
  image: { repository: shj3-web, tag: "" } # tag injected by release.sh; empty = fail
  replicas: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  hpa: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 65 }
  pdb: { enabled: true, minAvailable: 2 }

ai:
  image: { repository: shj3-ai, tag: "" }
  replicas: 3
  resources:
    requests: { cpu: "1", memory: 3Gi }
    limits: { cpu: "3", memory: 6Gi }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    metric: { name: shj3_ai_active_turns, averageValue: "16" }
  pdb: { enabled: true, minAvailable: 2 }
  maxConcurrentTurns: 24
  startupBudgetSeconds: 180

worker:
  replicas: 2
  resources:
    requests: { cpu: "1", memory: 3Gi }
    limits: { cpu: "4", memory: 8Gi } # re-index is the spikiest workload
  pdb: { enabled: true, minAvailable: 1 }

stores:
  sqlserver:
    mode: managed
    managedHost: shj3-sql.privatelink.shj.ae
  neo4j:
    # replicas is fixed at 1 and the chart `fail`s on any other value:
    # Community cannot cluster (ADR-0009), and a 2-replica StatefulSet on one
    # RWO volume would not be a cluster — it would be a second instance with
    # no data and a service that load-balances half the queries into it.
    mode: in-cluster
    edition: community
    replicas: 1
    storage: 200Gi
  qdrant:
    mode: in-cluster
    replicas: 2
    storage: 300Gi
    # §3.1: "2 replicas, replication factor 2" — threaded into the Qdrant
    # config as QDRANT__CLUSTER__ENABLED / QDRANT__CLUSTER__REPLICATION_FACTOR
    # (templates/stores/qdrant-sts.yaml).
    replicationFactor: 2
  redis:
    mode: managed
    managedHost: shj3-redis.privatelink.shj.ae

backup:
  neo4j:
    storage: 60Gi # scaled with stores.neo4j.storage (200Gi) above; a compressed dump is far smaller than the live graph

migration:
  runAsHook: false # production migrations are RB-06, never a hook

ingress:
  enabled: true
  className: nginx
  host: assistant.shj.ae
  tls:
    enabled: true
    secretName: shj3-edge-tls

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
