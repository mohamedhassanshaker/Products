<a class="la-skip-link" href="#main">Skip to main content</a>

<mat-sidenav-container class="la-shell">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="la-shell__sidenav"
    [fixedInViewport]="true"
  >
    <a
      class="la-shell__brand"
      routerLink="/deployments"
      title="Conversational Avatar Platform"
      aria-label="Conversational Avatar Platform"
    >
      <mat-icon aria-hidden="true">smart_toy</mat-icon>
      <span>Avatar Platform</span>
    </a>

    <nav aria-label="Admin" class="la-shell__nav">
      <mat-nav-list>
        @for (item of navItems; track item.route) {
          @if (item.live) {
            <a
              mat-list-item
              [routerLink]="item.route"
              routerLinkActive="la-shell__nav-item--active"
              [ariaCurrentWhenActive]="'page'"
              (click)="onNavItemActivated()"
            >
              {{ item.label }}
            </a>
          } @else {
            <span
              class="la-shell__nav-item la-shell__nav-item--disabled"
              aria-disabled="true"
              [attr.aria-label]="item.label + ', coming soon'"
              [matTooltip]="'Coming soon'"
            >
              {{ item.label }}
            </span>
          }
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="la-shell__toolbar">
      @if (isMobile()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation"
          class="la-shell__hamburger"
          (click)="toggleNav()"
        >
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <span class="la-shell__toolbar-spacer"></span>
      @if (authStore.user()) {
        <span class="la-shell__user-email" [title]="authStore.user()?.email">{{ authStore.user()?.email }}</span>
        <span class="la-shell__role-chip">{{ authStore.roleLabel() }}</span>
        <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Account menu">
          <mat-icon aria-hidden="true">arrow_drop_down</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item type="button" (click)="signOut()">Sign out</button>
        </mat-menu>
      }
    </mat-toolbar>

    @if (authStore.isLoading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading" />
    }

    <main id="main" class="la-shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
