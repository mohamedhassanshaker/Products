{{/*
§2.1 (ingress-nginx, TLS 1.3 termination) + §2.3's boundary table: "Only /,
/api/*, /widget/*, /webhooks/whatsapp, /webhooks/payments are routed" and
"ingress -> shj3-web:3000 exclusively" — every path this Ingress admits
points at the same shj3-web Service; shj3-web's own routing (and its BFF
proxy into shj3-ai) fans out further internally, which is *why* "only
shj3-web may reach shj3-ai" (§2.2) is a sufficient boundary for the whole
system, not just for this one Service.

Implements the path allowlist explicitly (5 rules) rather than a catch-all
`/` — §2.3 states this as a real boundary ("Only ... are routed"), not an
illustrative example, so a chart that routed everything would be less
restrictive than the documented boundary.
*/}}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is empty. Set the real hostname for this environment before enabling ingress (e.g. assistant.shj.ae) — there is no safe default to fall back to." -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shj3.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-web") | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # §16.3: TLS 1.3, HSTS, modern cipher suite only.
    nginx.ingress.kubernetes.io/hsts: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{/*
          All five as Prefix, corrected after a first draft tried "/" as
          Exact and reasoned through the consequence rather than shipping
          it: this app is locale-prefixed at every real route
          (next-intl's localePrefix: "always" — every page lives under
          /en/... or /ar/..., confirmed in tasks/todo.md's B-1 review), so
          an Exact match on the bare root would 404 every real page and
          every /_next/* static asset the moment a browser followed the "/"
          redirect. "/" as Prefix is the deliberate catch-all for the whole
          app (pages, static assets, the locale redirect's target); the
          other four are listed separately because they are distinct,
          individually-addressable route families §2.3 calls out by
          name — worth keeping nameable for their own WAF/rate-limit/
          signature-verification treatment (§2.3's own webhook row) even
          though every path here currently points at the same Service.
          */}}
          {{- range $rule := list
                (dict "path" "/" "pathType" "Prefix")
                (dict "path" "/api" "pathType" "Prefix")
                (dict "path" "/widget" "pathType" "Prefix")
                (dict "path" "/webhooks/whatsapp" "pathType" "Prefix")
                (dict "path" "/webhooks/payments" "pathType" "Prefix")
          }}
          - path: {{ $rule.path }}
            pathType: {{ $rule.pathType }}
            backend:
              service:
                name: {{ include "shj3.fullname" $ }}-web
                port:
                  number: {{ $.Values.web.containerPort }}
          {{- end }}
{{- end }}
