# Least-privilege ServiceAccounts — none of these planes talk to the Kubernetes API
# at all, so each gets an explicitly empty RBAC footprint (no Role/RoleBinding is
# granted) rather than inheriting the namespace's `default` ServiceAccount, which is
# frequently over-permissioned by cluster add-ons/admission controllers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextbot-web
  namespace: nextbot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextbot-gateway
  namespace: nextbot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextbot-worker
  namespace: nextbot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextbot-widget-embed
  namespace: nextbot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextbot-tools
  namespace: nextbot
automountServiceAccountToken: false
