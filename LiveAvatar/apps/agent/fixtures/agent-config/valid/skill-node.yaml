version: 1
deployment:
  tenant_id: "55555555-5555-5555-5555-555555555555"
  name: "Skill Node"
transport:
  provider: livekit
  room_namespace: skill-node
stt:
  provider: deepgram
  language: en-US
reasoning:
  entry_node_id: llm-1
  background_entry_node_ids: []
  turn_budget_ms: 4000
  graph:
    - id: llm-1
      type: llm
      name: Answer
      lane: foreground
      on_error: { action: degrade }
      on_deadline: { action: degrade }
      provider: openai
      model: gpt-4o-mini
      retry:
        max_attempts: 1
        backoff_ms: [200]
      next_node_id: skill-1
    - id: skill-1
      type: skill
      name: Refunds skill
      lane: foreground
      on_error: { action: degrade }
      on_deadline: { action: degrade }
      skill_id: "66666666-6666-6666-6666-666666666666"
      version: latest
      budget_ms: 1500
      next_node_id: null
tts:
  provider: fish-speech
  voice_id: v1
avatar:
  provider: bithuman
  avatar_id: a1
agent:
  runtime: langgraph
  system_prompt: "hi"
  tools: []
  memory:
    enabled: true
    window_turns: 16
knowledge:
  pipeline:
    rewrite:
      enabled: true
      context_turns: 3
      budget_ms: 150
    hybrid_search:
      vector_weight: 0.6
      keyword_weight: 0.4
      candidates: 20
      budget_ms: 100
    metadata_filter:
      enabled: false
      budget_ms: 20
    rerank:
      enabled: false
    threshold:
      min_score: 0.5
      budget_ms: 10
    inject:
      token_cap: 1200
      citation_format: numbered
      budget_ms: 30
skills:
  - id: "66666666-6666-6666-6666-666666666666"
    version: latest
privacy:
  send_to_remote_llm: prompt_text_only
  retain_transcripts_days: 90
  recordings_enabled: false
alerts:
  degraded_mode_message: "hold on"
