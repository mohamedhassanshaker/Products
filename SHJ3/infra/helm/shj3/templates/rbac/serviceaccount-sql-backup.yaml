{{/*
Same zero-permission-made-explicit reasoning as serviceaccount-web.yaml /
serviceaccount-migration.yaml (§7.8): the SQL backup CronJob's privilege is
the SQL principal in .Values.secrets.migrator (MSSQL_SA_PASSWORD, the same
key sqlserver-sts.yaml already reads for its own bootstrap admin), not a
Kubernetes RBAC role. An explicit, empty Role is a diff away from ever
silently growing scope — belt-and-braces on top of
automountServiceAccountToken: false, not the control itself.

Only rendered when the backup CronJob itself renders (see
stores/sqlserver-backup-cronjob.yaml's own gating comment) — no Kubernetes
identity for a workload that does not exist.
*/}}
{{- if and .Values.backup.sql.enabled (eq .Values.stores.sqlserver.mode "in-cluster") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shj3.fullname" . }}-sql-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-sql-backup") | nindent 4 }}
  annotations:
    shj3.ae/purpose: "SQL Server backup CronJob; privilege is the SQL principal, not Kubernetes RBAC"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shj3.fullname" . }}-sql-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-sql-backup") | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shj3.fullname" . }}-sql-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-sql-backup") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shj3.fullname" . }}-sql-backup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "shj3.fullname" . }}-sql-backup
  apiGroup: rbac.authorization.k8s.io
{{- end }}
