# Least-privilege ServiceAccounts (no workload runs under `default`). None of
# these components need to talk to the Kubernetes API at all, so no Role is
# bound — `automountServiceAccountToken: false` removes even the ability to
# authenticate to the API server from inside the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liveavatar-web
  namespace: liveavatar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liveavatar-agent
  namespace: liveavatar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liveavatar-migrate
  namespace: liveavatar
automountServiceAccountToken: false
