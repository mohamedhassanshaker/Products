# Local development dependencies only (LLD §1: "docker/docker-compose.dev.yml # mysql:8.4, qdrant,
# mailhog"). The application itself runs via `npm run start:dev` against these, not as a compose
# service, so edit-reload stays fast.
version: '3.9'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: examland_dev_root
      MYSQL_DATABASE: examland_platform
      MYSQL_USER: examland
      MYSQL_PASSWORD: examland_dev
    ports:
      - '3306:3306'
    volumes:
      - examland_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pexamland_dev_root']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - examland_qdrant_data:/qdrant/storage

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  examland_mysql_data:
  examland_qdrant_data:
