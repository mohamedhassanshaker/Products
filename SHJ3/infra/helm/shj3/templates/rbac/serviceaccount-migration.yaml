{{/*
§7.8: "Only the migration Job has a distinct ServiceAccount, and it grants
nothing in Kubernetes either — its privilege is the SQL principal in
shj3-migrator-secrets, not an RBAC role." §7.1's own `rbac/` file listing
does not spell out this exact filename (it names `serviceaccount-web.yaml
serviceaccount-ai.yaml role-*.yaml` only) — created anyway because §7.8's
prose is unambiguous that this ServiceAccount must exist, and job.yaml
already references it by name.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shj3.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-migration") | nindent 4 }}
  annotations:
    shj3.ae/purpose: "N-tenant migration Job; privilege is the SQL principal, not Kubernetes RBAC"
automountServiceAccountToken: false
---
{{/* Same zero-permission-made-explicit reasoning as role-web.yaml/role-ai.yaml. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shj3.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-migration") | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shj3.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-migration") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shj3.fullname" . }}-migration
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "shj3.fullname" . }}-migration
  apiGroup: rbac.authorization.k8s.io
