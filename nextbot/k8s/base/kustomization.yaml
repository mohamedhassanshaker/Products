apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextbot
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - deployment-web.yaml
  - deployment-gateway.yaml
  - deployment-worker.yaml
  - deployment-widget-embed.yaml
  - jobs-init.yaml
  - ingress.yaml
  - networkpolicy.yaml
# secrets.yaml.example is intentionally NOT listed here — see its own header
# comment. Provision the real `nextbot-secrets` Secret via your secret-management
# tool before applying this kustomization.
