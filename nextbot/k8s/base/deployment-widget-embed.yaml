apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextbot-widget-embed
  namespace: nextbot
  labels: { app: nextbot-widget-embed }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: nextbot-widget-embed }
  template:
    metadata:
      labels: { app: nextbot-widget-embed }
    spec:
      serviceAccountName: nextbot-widget-embed
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: widget-embed
          image: nextbot-widget-embed:REPLACE_ME_TAG
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: nextbot-widget-embed
  namespace: nextbot
spec:
  selector: { app: nextbot-widget-embed }
  ports:
    - { port: 8080, targetPort: 8080 }
  type: ClusterIP
