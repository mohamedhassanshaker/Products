{{/* §7.8's own shown example, verbatim (name/annotation/automount). Shared by shj3-ai and shj3-worker (same image, ADR-0001). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shj3.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-ai") | nindent 4 }}
  annotations:
    shj3.ae/purpose: "agent runtime; no Kubernetes API access required"
automountServiceAccountToken: false
