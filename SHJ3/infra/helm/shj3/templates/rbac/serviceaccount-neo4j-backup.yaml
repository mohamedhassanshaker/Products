{{/*
The FIRST real Kubernetes RBAC grant in this chart — every other workload
(web, ai, migration, sql-backup) deliberately holds `rules: []`, because each
one's privilege is a database/SQL principal, never the Kubernetes API
(serviceaccount-web.yaml / serviceaccount-migration.yaml /
serviceaccount-sql-backup.yaml all state this explicitly). That convention
does not extend here, and this is not an oversight — it is a real,
structural difference in what Neo4j Community's backup mechanism requires,
found by actually running the commands (see neo4j-backup-cronjob.yaml's own
header for the full drill):

  - `cypher-shell -d system "STOP DATABASE neo4j;"` — the Enterprise-only
    administration command deployment.md §12.5 previously assumed would work
    in Community — returns "Unsupported administration command" on the real,
    pinned image. Confirmed directly, not assumed.
  - `neo4j-admin database dump` then refuses ("The database is in use.")
    against ANY database still mounted in a running server — also confirmed
    directly, including via `kubectl exec` into the live pod, which is
    deployment.md §12.5's own pre-existing (and, it turns out, equally
    broken) design.

There is therefore no way to quiesce Neo4j Community for an offline dump
without stopping the whole server process, which for a single-pod
StatefulSet with no Enterprise clustering means scaling the StatefulSet to 0
— an operation that inherently requires the Kubernetes API, not a database
credential. This ServiceAccount's privilege is real, narrowly scoped to
exactly what that requires, and grants NOTHING beyond it:

  1. `statefulsets/scale` get/update/patch, resourceName-scoped to the ONE
     neo4j StatefulSet this release owns — cannot scale anything else.
  2. `pods` get, resourceName-scoped to the ONE neo4j-0 pod — used only to
     poll for its termination/readiness, never to read or modify it.
  3. `pods` create/get/delete, NOT resourceName-scoped — Kubernetes RBAC has
     no mechanism to scope `create` by name (the object does not exist yet),
     and the worker pod this Job creates is deleted and re-created each run
     under the SAME fixed name (see the CronJob's own header), so `get`/
     `delete` easily scope to it but `create` structurally cannot be
     narrowed further than "pods, this namespace". This is the one place
     this grant is broader than "exactly one object" and it is named here
     rather than left implicit.
  4. `pods/log` get, same fixed worker-pod name — reads the worker's own
     output so a verification failure is visible in the CronJob's own logs,
     not just a silent non-zero exit.

`automountServiceAccountToken: true` (also a first — every other
ServiceAccount in this chart sets it `false`) because `kubectl`'s in-cluster
auth mode requires the bound token to reach the API server at all; there is
no privilege here without it.
*/}}
{{- if eq .Values.stores.neo4j.mode "in-cluster" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shj3.fullname" . }}-neo4j-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-neo4j-backup") | nindent 4 }}
  annotations:
    shj3.ae/purpose: "Neo4j offline backup CronJob orchestrator; the one workload in this chart that genuinely needs Kubernetes RBAC (scale the neo4j StatefulSet to 0/1, run a throwaway worker pod) rather than a database credential — see this file's own header."
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shj3.fullname" . }}-neo4j-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-neo4j-backup") | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["{{ include "shj3.fullname" . }}-neo4j"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["{{ include "shj3.fullname" . }}-neo4j-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["{{ include "shj3.fullname" . }}-neo4j-backup-worker"]
    verbs: ["get", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"] # cannot be resourceName-scoped — the object does not exist yet (see this file's header)
  - apiGroups: [""]
    resources: ["pods/log"]
    resourceNames: ["{{ include "shj3.fullname" . }}-neo4j-backup-worker"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shj3.fullname" . }}-neo4j-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shj3.labels" (dict "root" $ "component" "shj3-neo4j-backup") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shj3.fullname" . }}-neo4j-backup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "shj3.fullname" . }}-neo4j-backup
  apiGroup: rbac.authorization.k8s.io
{{- end }}
